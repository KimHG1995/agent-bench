name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o bin/agent-bench ./cmd/agent-bench
      - run: go build -o bin/claude-adapter ./cmd/claude-adapter
      - run: bash -n scripts/run-claude-comparison.sh
