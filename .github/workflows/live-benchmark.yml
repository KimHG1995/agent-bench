name: live benchmark

on:
  workflow_dispatch:
    inputs:
      provider:
        description: API provider
        required: true
        default: orcarouter
        type: choice
        options:
          - orcarouter
          - openai
      model:
        description: Model slug/name
        required: true
        default: orcarouter/auto
        type: string
      repeat:
        description: Repeats per task
        required: true
        default: "3"
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AGENT_BENCH_TS_GRAPH_HOST: targets/ts-graph-tools
      AGENT_BENCH_OUT_DIR: results/live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Configure provider
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.provider }}" in
            orcarouter)
              if [[ -z "${ORCAROUTER_API_KEY:-}" ]]; then
                echo "ORCAROUTER_API_KEY secret is not configured" >&2
                exit 1
              fi
              echo "AGENT_BENCH_OPENAI_BASE_URL=https://api.orcarouter.ai/v1" >> "$GITHUB_ENV"
              echo "AGENT_BENCH_OPENAI_API_KEY=$ORCAROUTER_API_KEY" >> "$GITHUB_ENV"
              ;;
            openai)
              if [[ -z "${OPENAI_API_KEY:-}" ]]; then
                echo "OPENAI_API_KEY secret is not configured" >&2
                exit 1
              fi
              echo "AGENT_BENCH_OPENAI_BASE_URL=https://api.openai.com/v1" >> "$GITHUB_ENV"
              echo "AGENT_BENCH_OPENAI_API_KEY=$OPENAI_API_KEY" >> "$GITHUB_ENV"
              ;;
          esac
          echo "AGENT_BENCH_OPENAI_MODEL=${{ inputs.model }}" >> "$GITHUB_ENV"
          echo "AGENT_BENCH_REPEAT=${{ inputs.repeat }}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          go build -o bin/agent-bench ./cmd/agent-bench
          go build -o bin/openai-adapter ./cmd/openai-adapter

      - name: Prepare fixed targets
        run: |
          bash scripts/prepare-loglens.sh
          bash scripts/prepare-ts-graph-tools.sh

      - name: Run paired baseline vs graph benchmark
        run: bash scripts/run-openai-comparison.sh

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: "agent-bench-${{ inputs.provider }}-${{ inputs.model }}"
          path: results/live/
          if-no-files-found: error
          retention-days: 14
