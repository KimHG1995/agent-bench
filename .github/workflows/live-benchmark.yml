name: live benchmark

on:
  workflow_dispatch:
    inputs:
      provider:
        description: API provider
        required: true
        default: orcarouter
        type: choice
        options: [orcarouter, openai]
      model:
        description: Model slug/name
        required: true
        default: orcarouter/auto
        type: string
      repeat:
        description: Repeats per task
        required: true
        default: "3"
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AGENT_BENCH_TS_GRAPH_HOST: targets/ts-graph-tools
      AGENT_BENCH_OUT_DIR: results/live
      AGENT_BENCH_EXPERIMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      AGENT_BENCH_HARNESS_REVISION: ${{ github.sha }}
      AGENT_BENCH_GRAPH_REVISION: 6cc701bde596a955cb95824f67e896e13c10fff2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Configure provider
        id: configure
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.provider }}" in
            orcarouter)
              test -n "${ORCAROUTER_API_KEY:-}" || { echo "ORCAROUTER_API_KEY secret is not configured" >&2; exit 1; }
              echo "AGENT_BENCH_OPENAI_BASE_URL=https://api.orcarouter.ai/v1" >> "$GITHUB_ENV"
              echo "AGENT_BENCH_OPENAI_API_KEY=$ORCAROUTER_API_KEY" >> "$GITHUB_ENV"
              ;;
            openai)
              test -n "${OPENAI_API_KEY:-}" || { echo "OPENAI_API_KEY secret is not configured" >&2; exit 1; }
              echo "AGENT_BENCH_OPENAI_BASE_URL=https://api.openai.com/v1" >> "$GITHUB_ENV"
              echo "AGENT_BENCH_OPENAI_API_KEY=$OPENAI_API_KEY" >> "$GITHUB_ENV"
              ;;
          esac
          echo "AGENT_BENCH_OPENAI_MODEL=${{ inputs.model }}" >> "$GITHUB_ENV"
          echo "AGENT_BENCH_REPEAT=${{ inputs.repeat }}" >> "$GITHUB_ENV"
          safe_model="$(printf '%s' "${{ inputs.model }}" | tr '/\\:*?"<>|' '-')"
          echo "artifact_name=agent-bench-${{ inputs.provider }}-$safe_model-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          go build -o bin/agent-bench ./cmd/agent-bench
          go build -o bin/openai-adapter ./cmd/openai-adapter

      - name: Prepare fixed targets
        run: |
          bash scripts/prepare-loglens.sh
          bash scripts/prepare-ts-graph-tools.sh

      - name: Run paired baseline vs graph benchmark
        id: benchmark
        run: bash scripts/run-openai-comparison.sh

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.configure.outputs.artifact_name || format('agent-bench-partial-{0}', github.run_id) }}"
          path: results/live/
          if-no-files-found: warn
          retention-days: 14
